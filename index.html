<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TOONHUB - 3D Figurines</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ==============================
         THREE JS SCENE
    =============================== -->

    <div id="scene"></div>


    <!-- ==============================
         LEFT CONTENT
    =============================== -->

    <div id="bottom-left">

        <h1 id="product-title">
            TOONHUB FIGURINES
        </h1>

        <p id="description">
            Discover our amazing collection of
            3D cartoon figurines. Rotate, explore
            and find your favourite character.
        </p>


        <!-- Navigation -->

        <div id="nav-buttons">

            <button
                class="nav-btn"
                id="btn-prev"
                aria-label="Previous">

                <svg viewBox="0 0 24 24">

                    <polyline
                        points="15 18 9 12 15 6">
                    </polyline>

                </svg>

            </button>


            <button
                class="nav-btn"
                id="btn-next"
                aria-label="Next">

                <svg viewBox="0 0 24 24">

                    <polyline
                        points="9 18 15 12 9 6">
                    </polyline>

                </svg>

            </button>

        </div>

    </div>


    <!-- ==============================
         COUNTER
    =============================== -->

    <div id="counter">
        01 / 03
    </div>


    <!-- ==============================
         THREE.JS R128
    =============================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


    <!-- ==============================
         CUSTOM JAVASCRIPT
    =============================== -->

    <script src="js/script.js"></script>

</body>

</html>
